name: 'QuantumAPI Secrets'
description: 'Fetch QuantumVault secrets as masked environment variables, or sign and verify release artifacts with a QuantumAPI ML-DSA key.'
author: 'QuantumAPI'
branding:
  icon: 'lock'
  color: 'purple'

inputs:
  api-key:
    description: 'QuantumAPI API key (qapi_sk_…). Use a GitHub secret. Required. Scopes: secrets:read (secrets mode), sign (sign), verify (verify).'
    required: true
  mode:
    description: '`secrets` (default, inject QuantumVault secrets), `sign` (sign a file) or `verify` (verify a file signature).'
    required: false
    default: 'secrets'
  file:
    description: 'sign/verify: path of the file whose SHA-256 hash is signed/verified (same as `qapi sign --file`).'
    required: false
    default: ''
  key-id:
    description: 'sign/verify: UUID of the QuantumAPI ML-DSA signing key.'
    required: false
    default: ''
  signature:
    description: 'verify: path of the signature file produced by sign (or the raw base64 signature).'
    required: false
    default: ''
  signature-output:
    description: 'sign: where to write the signature. Defaults to `<file>.sig`.'
    required: false
    default: ''
  algorithm:
    description: 'sign: optional ML-DSA-44 | ML-DSA-65 | ML-DSA-87. Empty uses the key''s default (ML-DSA-65).'
    required: false
    default: ''
  secret-paths:
    description: |
      Newline-separated list of `ENV_VAR=secret-name` mappings. Lines starting
      with `#` are comments. Example:

        DB_PASSWORD=prod/db/password
        STRIPE_KEY=prod/stripe/api_key
    required: false
    default: ''
  endpoint:
    description: 'QuantumAPI endpoint (defaults to https://api.quantumapi.eu).'
    required: false
    default: 'https://api.quantumapi.eu'
  export-env:
    description: 'If true (default), values are written to $GITHUB_ENV. If false, values are only emitted as outputs.'
    required: false
    default: 'true'
  secrets-file:
    description: |
      Optional absolute path. When set, fetched secrets are also written to this
      file as `KEY=value` lines (one per line, mode 0600). It is the caller''s
      responsibility to clean up this file after use.
    required: false
    default: ''
  cache:
    description: |
      When `true`, results are memoized for the lifetime of the job by writing a
      key to `$GITHUB_STATE`. A subsequent invocation in the same job that
      requests the same set of paths will short-circuit and reuse the previously
      fetched values from $GITHUB_ENV (cache is job-scoped, not pipeline-scoped).
    required: false
    default: 'false'

outputs:
  signature-path:
    description: 'sign mode: path of the written signature file.'
    value: ${{ steps.signverify.outputs.signature-path }}
  verified:
    description: 'verify mode: `true` when the signature is valid (the step fails otherwise).'
    value: ${{ steps.signverify.outputs.verified }}
  injected-vars:
    description: 'Comma-separated list of environment variable names that were injected.'
    value: ${{ steps.inject.outputs.injected-vars }}
  cache-hit:
    description: 'Set to `true` when a previous invocation in this job already fetched the same set of paths and the cache was reused.'
    value: ${{ steps.inject.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - id: inject
      if: ${{ inputs.mode == 'secrets' || inputs.mode == '' }}
      shell: bash
      env:
        QAPI_API_KEY: ${{ inputs.api-key }}
        QAPI_ENDPOINT: ${{ inputs.endpoint }}
        QAPI_SECRET_PATHS: ${{ inputs.secret-paths }}
        QAPI_EXPORT_ENV: ${{ inputs.export-env }}
        QAPI_SECRETS_FILE: ${{ inputs.secrets-file }}
        QAPI_CACHE: ${{ inputs.cache }}
      run: |
        ${{ github.action_path }}/inject-secrets.sh
    - id: signverify
      if: ${{ inputs.mode == 'sign' || inputs.mode == 'verify' }}
      shell: bash
      env:
        QAPI_MODE: ${{ inputs.mode }}
        QAPI_API_KEY: ${{ inputs.api-key }}
        QAPI_ENDPOINT: ${{ inputs.endpoint }}
        QAPI_FILE: ${{ inputs.file }}
        QAPI_KEY_ID: ${{ inputs.key-id }}
        QAPI_SIGNATURE: ${{ inputs.signature }}
        QAPI_SIGNATURE_OUTPUT: ${{ inputs.signature-output }}
        QAPI_ALGORITHM: ${{ inputs.algorithm }}
      run: |
        ${{ github.action_path }}/sign-verify.sh
    - name: Reject unknown mode
      if: ${{ inputs.mode != 'secrets' && inputs.mode != '' && inputs.mode != 'sign' && inputs.mode != 'verify' }}
      shell: bash
      run: |
        echo "::error title=QuantumAPI::Unsupported mode '${{ inputs.mode }}' (expected secrets, sign or verify)"
        exit 1
